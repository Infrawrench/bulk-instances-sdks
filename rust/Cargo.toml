[package]
name = "infrawrench-bulk-instances"
version = "1.2.0"
edition = "2024"
rust-version = "1.87"
description = "AWS instance attributes and pricing (EC2, RDS, ElastiCache and more), with full history, from Infrawrench."
authors = ["Infrawrench LLC <astrid@infrawrench.com>"]
license = "MIT"
homepage = "https://infrawrench.com"
repository = "https://github.com/Infrawrench/bulk-instances-sdks"
readme = "README.md"
keywords = ["infrawrench", "aws", "ec2", "pricing", "price-history"]
categories = ["api-bindings", "web-programming::http-client"]
include = ["/src", "/README.md", "/LICENSE"]

[lib]
name = "infrawrench_bulk_instances"

[dependencies]
liblzma = "0.4.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
