# Publishes every SDK when a release tag is pushed.
#
# Trigger: pushing `v<version>` (e.g. `git tag v1.0.1 && git push origin v1.0.1`).
# Every manifest must already carry that version; `check` fails the run before
# anything ships if one does not. A tag is a deliberate act, so merging to main
# never publishes by itself.
#
# Re-runs: every publish job skips a version its registry already has, so
# re-running after a partial failure gets the stragglers out without tripping
# over what already shipped.
#
# Auth: OIDC trusted publishing wherever the registry supports it, so no
# long-lived tokens are stored: npm, PyPI, RubyGems, crates.io and NuGet. Each
# registry's trusted publisher must name this repository, `publish.yml` and the
# `release` environment. Maven Central has no OIDC path and needs Portal
# credentials plus a GPG key. Go needs only a `go/v<version>` tag in this
# repository. Packagist cannot serve a package from a subdirectory, so PHP is
# pushed to a satellite repository, which needs a GitHub App token.
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Publishing is not cancel-safe: a half-cancelled fan-out leaves some registries
# on the new version and some on the old.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check versions
    # workflow_dispatch can target any ref; only a release tag may publish.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Every manifest carries the tag's version
        id: version
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          grep -q "\"version\": \"$V\"" ts/package.json
          grep -q "^version = \"$V\"" python/pyproject.toml
          grep -q "VERSION = \"$V\"" ruby/lib/infrawrench/bulk_instances/version.rb
          grep -q "<version>$V</version>" java/pom.xml
          grep -q "<Version>$V</Version>" csharp/Infrawrench.BulkInstances.csproj
          grep -q "^version = \"$V\"" rust/Cargo.toml
          grep -q "\"version\": \"$V\"" php/composer.json
          echo "All manifests report $V."

  # --------------------------------------------------------------------------
  # OIDC trusted publishing — no stored credentials.
  # --------------------------------------------------------------------------

  npm:
    name: "npm — @infrawrench/bulk-instances"
    needs: check
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; the bundled CLI may be older.
      # Pinned rather than @latest: this job holds the id-token that publishes.
      - run: npm install -g npm@11.21.0
      - name: Publish
        working-directory: ts
        env:
          VERSION: ${{ needs.check.outputs.version }}
        # Scoped packages default to restricted, and provenance is automatic
        # under trusted publishing, so no --provenance flag. `prepack` builds.
        run: |
          set -euo pipefail
          if npm view "@infrawrench/bulk-instances@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::@infrawrench/bulk-instances@$VERSION is already published; skipping."
            exit 0
          fi
          npm ci --no-audit --no-fund
          npm publish --access public

  pypi:
    name: "PyPI — infrawrench-bulk-instances"
    needs: check
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: python -m pip install build==1.6.1
      - name: Build wheel and sdist
        working-directory: python
        run: python -m build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: python/dist
          skip-existing: true

  rubygems:
    name: "RubyGems — infrawrench-bulk_instances"
    needs: check
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with: { ruby-version: "3.4" }
      # The gem has no rake release tasks for `rubygems/release-gem` to drive, so
      # configure credentials from OIDC and run gem build/push directly.
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Build and push
        working-directory: ruby
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          if curl -sfo /dev/null "https://rubygems.org/api/v2/rubygems/infrawrench-bulk_instances/versions/$VERSION.json"; then
            echo "::notice::infrawrench-bulk_instances $VERSION is already published; skipping."
            exit 0
          fi
          gem build infrawrench-bulk_instances.gemspec
          gem push "infrawrench-bulk_instances-$VERSION.gem"

  crates:
    name: "crates.io — infrawrench-bulk-instances"
    needs: check
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
      # Cargo does not speak OIDC itself (RFC 3691) — this action exchanges the
      # GitHub token for a 30-minute crates.io token and revokes it on exit.
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish
        working-directory: rust
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          if curl -sfo /dev/null -H "User-Agent: infrawrench-ci" \
               "https://crates.io/api/v1/crates/infrawrench-bulk-instances/$VERSION"; then
            echo "::notice::infrawrench-bulk-instances $VERSION is already published; skipping."
            exit 0
          fi
          cargo publish --locked --token "${{ steps.auth.outputs.token }}"

  nuget:
    name: "NuGet — Infrawrench.BulkInstances"
    needs: check
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # The package targets net8.0 and net10.0; the .NET 10 SDK builds both.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with: { dotnet-version: "10.0.x" }
      - name: Build and pack
        working-directory: csharp
        run: |
          dotnet build -c Release
          dotnet pack -c Release --no-build -o ../nupkg
      # nuget.org keys live one hour, so mint immediately before the push.
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push
        run: |
          dotnet nuget push "nupkg/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  # --------------------------------------------------------------------------
  # Maven Central — the one registry with no OIDC trusted publishing.
  # --------------------------------------------------------------------------

  maven:
    name: "Maven Central — com.infrawrench:bulk-instances"
    needs: check
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "17"
          distribution: temurin
          # Writes a settings.xml with a <server id="central"> reading these env
          # vars, which is what central-publishing-maven-plugin authenticates with.
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      # Pinned to 3.9.x rather than the runner's Maven: under Maven 3.10
      # central-publishing-maven-plugin 0.11.0 stages files Central rejects
      # ("Bundle has content that does NOT have a .pom file").
      - name: Install Maven 3.9
        env:
          MAVEN_VERSION: 3.9.16
          MAVEN_SHA512: 831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6
        run: |
          set -euo pipefail
          TARBALL="apache-maven-$MAVEN_VERSION-bin.tar.gz"
          curl -sSfLo "$RUNNER_TEMP/$TARBALL" \
            "https://repo1.maven.org/maven2/org/apache/maven/apache-maven/$MAVEN_VERSION/$TARBALL"
          echo "$MAVEN_SHA512  $RUNNER_TEMP/$TARBALL" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/$TARBALL" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$MAVEN_VERSION/bin" >> "$GITHUB_PATH"
      - name: Deploy
        working-directory: java
        # `-Prelease` adds the sources/javadoc/GPG/publishing plugins Central
        # requires. Central rejects a duplicate version outright, so check first.
        run: |
          set -euo pipefail
          if curl -sfo /dev/null \
               "https://repo1.maven.org/maven2/com/infrawrench/bulk-instances/$VERSION/"; then
            echo "::notice::com.infrawrench:bulk-instances:$VERSION is already on Central; skipping."
            exit 0
          fi
          mvn --batch-mode --no-transfer-progress -Prelease deploy
        env:
          VERSION: ${{ needs.check.outputs.version }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  # --------------------------------------------------------------------------
  # Go and PHP have no central registry — `go get` and Packagist resolve a Git
  # URL and a semver tag, so publishing is a tag.
  # --------------------------------------------------------------------------

  go:
    name: "Go — github.com/infrawrench/bulk-instances-sdks/go"
    needs: check
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      # A module in a subdirectory is versioned by tags prefixed with its path.
      - name: Tag go/v${{ needs.check.outputs.version }}
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/go/v$VERSION" >/dev/null; then
            echo "::notice::go/v$VERSION already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "go/v$VERSION" -m "go/v$VERSION"
          git push origin "go/v$VERSION"
      # Ask the module proxy to fetch the new version so the first `go get`
      # doesn't have to wait for it.
      - name: Warm the Go module proxy
        run: |
          curl -fsS "https://proxy.golang.org/github.com/infrawrench/bulk-instances-sdks/go/@v/v${{ needs.check.outputs.version }}.info" \
            || echo "::warning::Proxy has not indexed the tag yet; it will catch up."

  php:
    name: "Packagist — infrawrench/bulk-instances"
    needs: check
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      # The satellite repository Packagist is registered against, e.g.
      # `bulk-instances-php`. Unset, the job is skipped with a notice.
      PHP_REPO: ${{ vars.PHP_REPO }}
    steps:
      - name: Satellite repository configured
        id: configured
        run: |
          if [ -z "$PHP_REPO" ]; then
            echo "::notice::Set the PHP_REPO repository variable to publish to Packagist; skipping."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: steps.configured.outputs.ok == 'true'
        with:
          path: source
      # OIDC cannot grant write access to a *different* repository, so this is
      # the one place a stored credential is unavoidable. A GitHub App is used
      # rather than a PAT: the token is installation-scoped and expires in an
      # hour.
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        if: steps.configured.outputs.ok == 'true'
        id: app-token
        with:
          app-id: ${{ secrets.SDK_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.SDK_PUBLISHER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.PHP_REPO }}
      - name: Push and tag
        if: steps.configured.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${PHP_REPO}.git" satellite
          cd satellite

          # Replace the tree wholesale, so a file removed here disappears there
          # too. `.git` is the only thing that survives.
          find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -R ../source/php/. .

          git config user.name "infrawrench-sdk-bot"
          git config user.email "astrid@infrawrench.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::${OWNER}/${PHP_REPO} already matches v${VERSION}; nothing to commit."
          else
            git commit -m "Release v${VERSION}

          Mirrored from the php/ directory of https://github.com/${{ github.repository }}. Do not edit here."
            git push origin HEAD
          fi

          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::notice::${OWNER}/${PHP_REPO} is already tagged v${VERSION}."
          else
            git tag -a "v${VERSION}" -m "v${VERSION}"
            git push origin "v${VERSION}"
          fi
