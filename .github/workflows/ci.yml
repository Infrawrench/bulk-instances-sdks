# Builds and lints every SDK, then runs the conformance suite against it.
#
# Each language runs on the oldest version its manifest claims to support and on
# the newest, so a floor that stops holding fails here rather than for a user.
# The suite (conformance/) serves a fixture bundle from a fake bundles server and
# compares each SDK's decoded output with the TypeScript SDK's, so every job is
# also a check that the ports have not drifted from each other.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Typecheck
        working-directory: ts
        run: npm ci --no-audit --no-fund && npm run typecheck
      - name: Conformance
        run: conformance/run.sh typescript

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build==1.6.1 mypy==2.4.1
      - name: Type-check
        working-directory: python
        run: mypy --strict src
      - name: Build sdist and wheel
        working-directory: python
        run: python -m build
      - name: Conformance
        run: conformance/run.sh python

  ruby:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "4.0"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Syntax and warnings
        working-directory: ruby
        run: for f in $(find lib -name '*.rb') *.gemspec; do ruby -wc "$f" >/dev/null; done
      - name: Build gem
        working-directory: ruby
        run: gem build infrawrench-bulk_instances.gemspec
      # The suite captures the dump's stderr, so warnings Ruby prints while
      # decoding would pass unnoticed there. Decode once from a seeded cache
      # and fail on any.
      - name: Runtime warnings
        run: |
          mkdir -p "$RUNNER_TEMP/seed" && cp conformance/fixture/bundle-*.json "$RUNNER_TEMP/seed/"
          ruby -w -I ruby/lib conformance/dumps/ruby/dump.rb http://127.0.0.1:9 "$RUNNER_TEMP/seed" test-token 1 \
            >/dev/null 2>"$RUNNER_TEMP/stderr.log"
          if [ -s "$RUNNER_TEMP/stderr.log" ]; then cat "$RUNNER_TEMP/stderr.log"; exit 1; fi
      - name: Conformance
        run: conformance/run.sh ruby

  java:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "25"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven
      - name: Javadoc
        working-directory: java
        run: mvn -B --no-transfer-progress javadoc:javadoc
      # Builds the jar with -Xlint:all -Werror on the way.
      - name: Conformance
        run: conformance/run.sh java

  csharp:
    name: C# (${{ matrix.tfm }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tfm: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Both runtimes: the package targets both, and the dump runs on one.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build and pack
        working-directory: csharp
        run: |
          dotnet build -c Release
          dotnet pack -c Release --no-build -o nupkg
      - name: Conformance
        env:
          DOTNET_TFM: ${{ matrix.tfm }}
        run: conformance/run.sh csharp

  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 1.87 is rust-version in Cargo.toml.
        toolchain: ["1.87", stable]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: ${{ matrix.toolchain }}
          components: ${{ matrix.toolchain == 'stable' && 'clippy, rustfmt' || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            rust
            conformance/dumps/rust
      - name: Build
        working-directory: rust
        run: cargo build --locked
      - name: Lint
        if: matrix.toolchain == 'stable'
        working-directory: rust
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo doc --locked --no-deps
          cargo test --locked --doc
      - name: Package
        working-directory: rust
        run: cargo package --locked
      - name: Conformance
        run: conformance/run.sh rust

  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.5"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          tools: composer
          coverage: none
      - name: Lint
        working-directory: php
        run: |
          find src -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          composer validate --strict --no-check-version
      # Without ext-xz, so this covers the xz-binary fallback.
      - name: Conformance
        run: conformance/run.sh php

  go:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 1.26 is the go directive in go.mod.
        go: ["1.26", stable]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            go/go.sum
            conformance/dumps/go/go.sum
      - name: Vet and format
        working-directory: go
        run: |
          go build ./...
          go vet ./...
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Conformance
        run: conformance/run.sh go
